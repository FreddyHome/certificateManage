spring:
  application:
    name: certificate-manage
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/certificate-manage}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
app:
  encryption-key-file: ${ENCRYPTION_KEY_FILE:./data/master.key}

spring.task.scheduling.pool.size: 4
