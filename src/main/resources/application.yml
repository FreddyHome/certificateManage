spring:
  application:
    name: certificate-manage
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/certificate-manage}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
app:
  encryption-key-file: ${ENCRYPTION_KEY_FILE:./data/master.key}
  sync:
    parallelism: ${SYNC_PARALLELISM:2}
    shutdown-wait-seconds: 5

spring.task.scheduling.pool.size: 4

logging:
  file:
    name: ${LOG_FILE:./logs/certificate-manage.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
