<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证书管理系统 · 管理后台原型</title></head><body>
<div id="cert-proto">
<style>
#cert-proto{--p-bg:light-dark(#f5f7fb,#151923);--p-panel:light-dark(#fff,#202633);--p-text:light-dark(#19273b,#e4eaf4);--p-sub:light-dark(#65738a,#a4b1c6);--p-line:light-dark(#e2e8f0,#364155);--p-blue:light-dark(#285bd5,#8cafff);--p-soft:light-dark(#eaf0ff,#293c60);background:var(--p-bg);color:var(--p-text);font:14px/1.6 system-ui,sans-serif;border-radius:12px;overflow:hidden}
#cert-proto *{box-sizing:border-box}#cert-proto .shell{display:grid;grid-template-columns:164px minmax(0,1fr)}#cert-proto aside{background:var(--p-panel);padding:24px 14px;border-right:1px solid var(--p-line)}#cert-proto .brand{font-weight:650;font-size:18px;margin-bottom:6px}#cert-proto .minor{color:var(--p-sub);font-size:12px}#cert-proto nav{display:grid;gap:8px;margin-top:30px}#cert-proto button,#cert-proto input,#cert-proto select{font:inherit}#cert-proto button{cursor:pointer;border:1px solid var(--p-line);border-radius:7px;padding:7px 12px;background:var(--p-panel);color:var(--p-text)}#cert-proto button.primary{background:var(--p-blue);color:light-dark(#fff,#111c35);border-color:var(--p-blue)}#cert-proto nav button{text-align:left;border:0;background:transparent}#cert-proto nav button.active{background:var(--p-soft);color:var(--p-blue)}#cert-proto header{padding:16px 24px;background:var(--p-panel);border-bottom:1px solid var(--p-line)}#cert-proto main{padding:24px;min-width:0}#cert-proto h2{font-size:22px;margin:0}#cert-proto h3{font-size:16px;margin:0 0 12px}#cert-proto .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#cert-proto .spread{justify-content:space-between}#cert-proto .panel{padding:20px;background:var(--p-panel);border:1px solid var(--p-line);border-radius:10px;margin-top:18px}#cert-proto .toolbar{margin:18px 0}#cert-proto input,#cert-proto select{padding:8px 10px;border:1px solid var(--p-line);border-radius:6px;background:var(--p-panel);color:var(--p-text);max-width:100%;min-width:0}#cert-proto .scroll{overflow-x:auto}#cert-proto table{width:100%;border-collapse:collapse;white-space:nowrap}#cert-proto th,#cert-proto td{padding:13px 9px;text-align:left;border-bottom:1px solid var(--p-line)}#cert-proto th{color:var(--p-sub);font-size:12px;font-weight:500}#cert-proto .tag{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--p-soft);color:var(--p-blue);font-size:12px}#cert-proto .warn{color:light-dark(#a6530a,#ffbe73)}#cert-proto .link{border:0;color:var(--p-blue);padding:0;background:transparent}#cert-proto .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#cert-proto label{display:grid;gap:5px;color:var(--p-sub)}#cert-proto .chain{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}#cert-proto .chain button{min-width:140px;text-align:left}#cert-proto .chain button.active{border-color:var(--p-blue);background:var(--p-soft)}#cert-proto dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}#cert-proto dt{color:var(--p-sub)}#cert-proto dd{margin:0;overflow-wrap:anywhere}#cert-proto .note{margin-top:14px;color:var(--p-sub)}#cert-proto #cp-msg{padding:0 24px 18px;color:var(--p-blue)}@media(max-width:700px){#cert-proto .shell{grid-template-columns:1fr}#cert-proto aside{padding:12px}#cert-proto nav{display:flex;flex-wrap:wrap;margin-top:12px}#cert-proto main{padding:14px}#cert-proto .grid{grid-template-columns:1fr}#cert-proto header{padding:12px}#cert-proto dl{grid-template-columns:85px minmax(0,1fr)}}
</style>
<style>
html{color-scheme:light}body{margin:0;background:#f0f2f5;font-family:Arial,"Microsoft YaHei",sans-serif}#cert-proto{border-radius:0;min-height:100vh;--p-bg:#f0f2f5;--p-panel:#fff;--p-text:#303133;--p-sub:#909399;--p-line:#ebeef5;--p-blue:#409eff;--p-soft:#ecf5ff}#cert-proto .shell{grid-template-columns:210px minmax(0,1fr);min-height:100vh}#cert-proto aside{background:#001529;color:#c7d0dc;border:0;padding:24px 12px}#cert-proto aside .brand{color:#fff;padding-left:12px}#cert-proto aside .minor{color:#a7b5c7;padding-left:12px}#cert-proto nav button{color:#bac7d6;border-radius:3px;padding:12px 16px}#cert-proto nav button:hover{background:#102b43;color:#fff}#cert-proto nav button.active{background:#1890ff;color:#fff}#cert-proto header{min-height:60px;box-shadow:0 1px 4px #00152914}#cert-proto header>span:first-child{font-weight:600}#cert-proto .panel{border-radius:4px;border:0;box-shadow:0 1px 3px #00000008}#cert-proto button{border-radius:4px}#cert-proto h2{font-size:20px;font-weight:600}#cert-proto h3{font-weight:600}#cert-proto th{background:#fafafa;color:#606266;font-weight:600}#cert-proto td{padding:12px 9px}#cert-proto tbody tr:hover{background:#f5f7fa}#cert-proto input:focus,#cert-proto select:focus{outline:2px solid #a0cfff;outline-offset:1px}#cert-proto button:disabled{opacity:.5;cursor:not-allowed}#cert-proto button.primary{color:#fff}#cert-proto .warn{color:#b86208}#cert-proto .toolbar{background:#fff;padding:16px;border-radius:4px}#cert-proto #cp-msg:empty{padding:0}@media(max-width:700px){#cert-proto .shell{grid-template-columns:1fr}#cert-proto aside{padding:12px}#cert-proto nav{margin-top:10px}}
</style>
<div class="shell"><aside><div class="brand">CertHub</div><div class="minor">内部证书管理</div><nav aria-label="主菜单"></nav><div class="note minor">MVP · 交互原型<br>所有用户均为管理员</div></aside><div><header class="row spread"><span>证书管理工作台</span><span class="minor">管理员 · admin</span></header><main id="cp-main"></main><div id="cp-msg" aria-live="polite"></div></div></div>
<script>
(()=>{const root=document.getElementById('cert-proto'),main=root.querySelector('#cp-main'),nav=root.querySelector('nav'),msg=root.querySelector('#cp-msg');
const menus=['自有证书','客户证书','证书生成','过期通知','用户管理'];let page=0,filter='',query='',selected=null;
const certs=[{n:'内部根 CA',u:'通用',t:'根 CA',l:1,d:'2036-10-31',s:'有效',owner:0},{n:'业务签发 CA',u:'通用',t:'中间 CA',l:2,d:'2031-10-31',s:'有效',owner:0},{n:'as2.company.example',u:'AS2',t:'终端证书',l:3,d:'2026-11-20',s:'即将过期',owner:0},{n:'portal.company.example',u:'HTTPS',t:'终端证书',l:3,d:'2027-10-31',s:'有效',owner:0},{n:'客户 A · AS2 加密',u:'AS2',t:'终端证书',l:3,d:'2027-05-01',s:'有效',owner:1,c:'客户 A'},{n:'客户 B · HTTPS 信任根',u:'HTTPS',t:'根 CA',l:1,d:'2030-08-01',s:'有效',owner:1,c:'客户 B'},{n:'客户 C · 通用证书',u:'通用',t:'终端证书',l:null,d:'2026-12-01',s:'有效',owner:1,c:'客户 C'}];
function say(t){msg.textContent=t}function options(a){return a.map(v=>`<option>${v}</option>`).join('')}function field(n,value,type='text'){return `<label>${n}<input type="${type}" value="${value}"></label>`}function select(n,a){return `<label>${n}<select>${options(a)}</select></label>`}function action(id,text,primary=false){return `<button data-act="${id}" class="${primary?'primary':''}">${text}</button>`}
function render(){say('');nav.innerHTML=menus.map((m,i)=>`<button data-page="${i}" class="${i===page?'active':''}">${m}</button>`).join('');if(page<2)list();else if(page===2)generate();else if(page===3)mail();else users()}
function list(){main.innerHTML=`<div class="row spread"><div><h2>${menus[page]}</h2><div class="minor">${page?'管理客户公钥证书，维护 HTTPS 信任与 AS2 通信证书':'统一管理自有证书与私钥'}</div></div>${action('import','导入证书',true)}</div><div class="toolbar row"><input id="cp-search" aria-label="搜索证书" placeholder="搜索名称${page?' / 客户':''}" value="${query}"><select id="cp-filter" aria-label="用途筛选">${options(['全部用途','AS2','HTTPS','通用'])}</select></div><div class="panel scroll"><table><thead><tr><th>证书名称${page?' / 客户':''}</th><th>用途</th><th>证书类型</th><th>层级</th><th>到期时间</th><th>状态</th><th>${page?'内容':'私钥'}</th><th>操作</th></tr></thead><tbody id="cp-rows"></tbody></table><div class="note minor">层级从根 CA 开始计数；链不完整时显示“待确定”。</div></div>`;root.querySelector('#cp-filter').value=filter||'全部用途';rows()}
function rows(){const a=certs.map((c,i)=>({...c,i})).filter(c=>c.owner===page&&(!filter||c.u===filter)&&(c.n+(c.c||'')).toLowerCase().includes(query.toLowerCase()));root.querySelector('#cp-rows').innerHTML=a.map(c=>`<tr><td>${c.n}${c.c?`<div class="minor">${c.c}</div>`:''}</td><td><span class="tag">${c.u}</span></td><td>${c.t}</td><td>${c.l?'第 '+c.l+' 层':'待确定'}</td><td>${c.d}</td><td class="${c.s==='即将过期'?'warn':''}">${c.s}</td><td>${page?'仅公钥':'已加密保存'}</td><td><button class="link" data-view="${c.i}">查看</button></td></tr>`).join('')||'<tr><td colspan="8">无匹配证书</td></tr>'}
function detail(i){selected=certs[i];const c=selected;main.innerHTML=`${action('back','← 返回列表')}<div class="row spread" style="margin-top:18px"><div><h2>${c.n}</h2><span class="tag">${c.u}</span> ${c.t} · ${c.l?'第 '+c.l+' 层':'层级待确定'}</div><div class="row">${action('export','导出证书')}${c.owner?'':action('key','导出私钥')}</div></div><div class="panel"><h3>证书链</h3><div class="minor">${c.l?'链路完整 · 根 → 中间 → 当前证书':'链不完整 · 缺少签发者证书，无法确定完整层级'}</div><div class="chain" id="cp-chain"></div><div class="minor">链路完整性不代表业务系统已配置信任。</div></div><div class="panel" id="cp-node"></div>`;const names=c.l===1?[c.n]:c.l===2?['内部根 CA',c.n]:c.l===3?[c.owner?'客户根 CA':'内部根 CA',c.owner?'客户中间 CA':'业务签发 CA',c.n]:[c.n];root.querySelector('#cp-chain').innerHTML=names.map((n,j)=>`${j?' <span>→</span> ':''}<button data-node="${j}" data-name="${n}">${n}<br><span class="minor">${c.l?'第 '+(j+1)+' 层':'当前证书'}</span></button>`).join('');node(names.length-1,names[names.length-1])}
function node(j,n){root.querySelectorAll('[data-node]').forEach(b=>b.classList.toggle('active',+b.dataset.node===j));root.querySelector('#cp-node').innerHTML=`<h3>${n}</h3><dl><dt>Subject</dt><dd>CN=${n}</dd><dt>Issuer</dt><dd>${j===0&&selected.l?'自身（根 CA）':j===2?'CN=业务中间 CA':'CN=签发 CA'}</dd><dt>CA 属性</dt><dd>${selected.l&&(j<selected.l-1||selected.t!=='终端证书')?'是':'否'}</dd><dt>公钥算法</dt><dd>RSA 3072</dd><dt>到期时间</dt><dd>${selected.d}</dd><dt>SHA-256 指纹</dt><dd>8A:4F:2B:91:…:C7:30（演示）</dd><dt>私钥</dt><dd>${selected.owner?'未保存':'已加密保存 · 不展示内容'}</dd></dl>`}
function importer(){main.innerHTML=`${action('back','← 返回列表')}<h2 style="margin-top:18px">导入${menus[page]}</h2><div class="panel"><div class="grid">${''}${select('用途',['AS2','HTTPS','通用'])}${page?field('所属客户',''):''}<label>公钥证书<input type="file" accept=".pem,.crt,.cer,.der,.p12,.pfx"></label>${page?'':`<label>私钥文件（或随 PFX 导入）<input type="file" accept=".key,.pem"></label>${field('文件密码（如有）','','password')}`}</div><p class="minor">${page?'仅导入公钥证书；检测到私钥时拒绝。':'导入时校验证书和私钥匹配关系，私钥加密保存。'} 证书名称从 Subject CN 自动解析，类型、层级、签发者自动解析。</p>${action('preview-import','解析并预览',true)}<div id="cp-import-result"></div></div>`}
function generate(){main.innerHTML=`<h2>证书生成</h2><div class="minor">复用 CA 签发，或创建新的三层证书链</div><div class="panel"><div class="grid">${select('生成模式',['使用已有中间 CA 签发','新建完整三层证书链','创建根 CA','创建中间 CA'])}${select('签发 CA',['业务签发 CA · 第 2 层'])}${field('证书名称','as2-new.company.example')}${select('用途',['AS2','HTTPS','通用'])}${field('主体 Common Name','as2-new.company.example')}${field('组织 Organization','Company')}${field('SAN（域名 / IP，HTTPS 使用）','as2-new.company.example')}${select('算法',['RSA 3072','RSA 2048','ECDSA P-256'])}${field('有效天数','365','number')}${field('导出包密码','','password')}</div><p class="minor">子证书有效期受签发 CA 限制。生成成功后归档为自有证书。</p>${action('generate','预览生成结果',true)}<div id="cp-generated"></div></div>`}
function mail(){main.innerHTML=`<h2>过期通知</h2><div class="minor">邮件渠道 · 自有证书与客户证书统一提醒</div><div class="panel"><h3>SMTP 配置</h3><div class="grid">${field('SMTP 服务器','smtp.company.example')}${field('端口','587','number')}${select('传输加密',['STARTTLS','TLS'])}${field('发件人','certs@company.example')}${field('账号','certs@company.example')}${field('认证密码','','password')}</div><hr><h3>提醒规则</h3><div class="grid">${field('收件人（逗号分隔）','ops@company.example')}${field('提前提醒天数','30, 14, 7, 1')}${field('每日检查时间','09:00','time')}${select('时区',['Asia/Shanghai'])}</div><p><label><span><input type="checkbox" checked> 启用邮件提醒</span></label></p><div class="row">${action('save','保存配置',true)}${action('test','发送测试邮件')}</div></div><div class="panel scroll"><h3>发送记录</h3><table><thead><tr><th>时间</th><th>证书</th><th>节点</th><th>收件人</th><th>结果</th></tr></thead><tbody><tr><td>2026-10-21 09:00</td><td>as2.company.example</td><td>提前 30 天</td><td>ops@company.example</td><td>成功（演示）</td></tr></tbody></table></div>`}
function users(){main.innerHTML=`<div class="row spread"><div><h2>用户管理</h2><div class="minor">当前所有用户拥有管理员权限，预留角色扩展</div></div>${action('add-user','新增用户',true)}</div><div class="panel scroll"><table><thead><tr><th>用户名</th><th>邮箱</th><th>权限</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>admin</td><td>admin@company.example</td><td>管理员</td><td>启用</td><td>当前用户</td></tr><tr><td>operator</td><td>ops@company.example</td><td>管理员</td><td id="cp-user-status">启用</td><td>${action('toggle-user','停用')}${action('reset','重置密码')}</td></tr></tbody></table><div id="cp-new-user"></div></div>`}

const oldList=list,oldRows=rows;let createLevel=3;
list=function(){if(page!==0){oldList();return}main.innerHTML='<div class="row spread"><div><h2>自有证书</h2><div class="minor">根证书 → 中间证书 → 叶子证书 · 分层管理</div></div>'+action('import','导入证书')+'</div><div class="toolbar row"><input id="cp-search" aria-label="搜索证书" placeholder="搜索证书名称"><select id="cp-filter" aria-label="用途筛选">'+options(['全部用途','AS2','HTTPS','通用'])+'</select></div>'+[1,2,3].map(l=>'<section class="panel"><div class="row spread"><div><h3>'+['根证书','中间证书','叶子证书'][l-1]+'</h3><span class="minor">第 '+l+' 层 · '+['自签名，作为信任起点','选择根证书签发','选择中间证书签发，支持 AS2 / HTTPS / 通用'][l-1]+'</span></div><button class="primary" data-create="'+l+'">创建'+['根证书','中间证书','叶子证书'][l-1]+'</button></div><div class="scroll"><table><thead><tr><th>名称</th><th>用途</th><th>类型 / 层级</th><th>签发者</th><th>到期时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="cp-level-'+l+'"></tbody></table></div></section>').join('');root.querySelector('#cp-search').value=query;root.querySelector('#cp-filter').value=filter||'全部用途';rows()};
rows=function(){if(page!==0){oldRows();return}for(let l=1;l<=3;l++){const a=certs.map((c,i)=>({...c,i})).filter(c=>c.owner===0&&c.l===l&&(!filter||c.u===filter)&&c.n.toLowerCase().includes(query.toLowerCase()));root.querySelector('#cp-level-'+l).innerHTML=a.map(c=>'<tr><td>'+c.n+'</td><td><span class="tag">'+c.u+'</span></td><td>'+c.t+' · 第 '+l+' 层</td><td>'+['自身（自签名）','内部根 CA','业务签发 CA'][l-1]+'</td><td>'+c.d+'</td><td>'+c.s+'</td><td><button class="link" data-view="'+c.i+'">查看</button></td></tr>').join('')||'<tr><td colspan="7">暂无匹配证书</td></tr>'}};
generate=function(){const l=createLevel;const parents=certs.filter(c=>c.owner===0&&c.l===l-1);main.innerHTML=action('back','← 返回列表')+'<h2 style="margin-top:18px">创建'+['根证书','中间证书','叶子证书'][l-1]+'</h2><div class="panel"><div class="row">'+[1,2,3].map(n=>'<button data-create="'+n+'" class="'+(n===l?'primary':'')+'">'+['根证书','中间证书','叶子证书'][n-1]+'</button>').join('')+'</div><p class="minor">'+(l===1?'根证书使用自身私钥签名，无需选择签发者。':'必须先有可用的'+(l===2?'根证书':'中间证书')+'，才能创建本层证书。')+'</p><div class="grid">'+(l>1?'<label>签发'+(l===2?'根证书':'中间证书')+'（必选）<select id="cp-parent">'+options(parents.length?parents.map(c=>c.n):['暂无可用签发者，请先创建上一层'])+'</select></label>':'')+field('主体 Common Name','Company')+select('用途',['通用','AS2','HTTPS'])+select('算法',['RSA 3072','RSA 2048','ECDSA P-256'])+field('有效天数',l===1?'3650':l===2?'1825':'365','number')+(l===3?field('SAN（HTTPS 域名 / IP）','new.company.example'):'')+'</div><p class="minor">'+(l===1?'CA 属性：是 · 第 1 层':l===2?'CA 属性：是 · 第 2 层':'CA 属性：否 · 第 3 层')+' · 私钥加密保存</p><button class="primary" data-sign="true" '+(l>1&&!parents.length?'disabled':'')+'>预览签发结果</button><div id="cp-generated"></div></div>'};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.create){createLevel=+b.dataset.create;generate()}if(b.dataset.sign){const parent=root.querySelector('#cp-parent');root.querySelector('#cp-generated').textContent='签发预览：'+(parent?parent.value+' → ':'自签名 → ')+['新根证书（第 1 层）','新中间证书（第 2 层）','新叶子证书（第 3 层）'][createLevel-1]+'。演示未执行真实签发。'}});


const customerListBase=list,customerRowsBase=rows;const expandedCustomers=new Set();
certs[5]={...certs[5],n:'客户 B · HTTPS 服务',t:'终端证书',l:3};
const customerChains={4:[{n:'客户 A 中间 CA',t:'中间 CA',l:2,d:'2029-05-01'},{n:'客户 A 根 CA',t:'根 CA',l:1,d:'2034-05-01'}],5:[{n:'客户 B 中间 CA',t:'中间 CA',l:2,d:'2031-08-01'},{n:'客户 B 根 CA',t:'根 CA',l:1,d:'2035-08-01'}],6:[]};
list=function(){customerListBase();if(page===1){main.querySelector('h2').nextElementSibling.textContent='默认仅显示终端证书 · 点击证书名称展开中间证书与根证书';const note=main.querySelector('.note');if(note)note.textContent='中间证书和根证书归属对应终端证书链，不单独占据主列表。链不完整时明确提示。'}};

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined){page=+b.dataset.page;filter='';query='';render();return}if(b.dataset.view!==undefined){detail(+b.dataset.view);return}if(b.dataset.node!==undefined){node(+b.dataset.node,b.dataset.name);return}const a=b.dataset.act;if(a==='back')render();else if(a==='import')importer();else if(a==='preview-import')root.querySelector('#cp-import-result').innerHTML='<p class="note">原型预览：终端证书 · 第 3 层 · 证书链完整。实际系统将在上传后解析和校验。</p>';else if(a==='generate')root.querySelector('#cp-generated').innerHTML='<div class="panel"><h3>签发结果预览</h3><p>内部根 CA（第 1 层） → 业务签发 CA（第 2 层） → 新业务证书（第 3 层）</p><span class="tag">终端证书</span> 私钥加密保存 · 归档至自有证书<p class="minor">演示结果，未执行真实签发。</p></div>';else if(a==='add-user')root.querySelector('#cp-new-user').innerHTML=`<hr><div class="grid">${field('用户名','')}${field('邮箱','')}${field('初始密码','','password')}</div><p>${action('save-user','保存用户',true)}</p>`;else if(a==='toggle-user'){const s=root.querySelector('#cp-user-status');s.textContent=s.textContent==='启用'?'停用':'启用';b.textContent=s.textContent==='启用'?'停用':'启用';say('用户状态已在原型中更新')}else say(({save:'配置已在原型中保存',test:'测试邮件流程已演示；未实际发送邮件',export:'证书导出流程已演示；无真实证书文件',key:'私钥导出需设置导出密码；原型不包含真实私钥',reset:'密码重置流程已演示','save-user':'新增用户流程已演示'})[a]||'');if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:menus[page],certificate:selected?.n||null},privateContent:null}).catch(()=>{})});render();})();
</script>
